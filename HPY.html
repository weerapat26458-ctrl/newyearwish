<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Event: Wishes Train 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;800&family=Mountains+of+Christmas:wght@700&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000 url('bg.png') no-repeat center center / cover;
            font-family: 'Kanit', sans-serif; 
            color: white; 
            height: 100vh; 
            position: relative; 
        }

        #fireworks-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none;
        }

        /* --- LOGO & HEADER --- */
        .logo-box {
            position: fixed; top: 20px; left: 20px; z-index: 200; width: 250px;
            animation: logoFloat 4s ease-in-out infinite;
        }
        .logo-box img { width: 100%; height: auto; border-radius: 50%; filter: drop-shadow(0 0 10px #00e5ff); }

        .main-header {
            position: fixed; top: 20px; left: 50%; transform: translateX(-50%);
            z-index: 100; text-align: center; width: 100%; pointer-events: none;
        }
        .main-header h1 {
            font-weight: 800; font-size: 4rem; margin: 0;
            background: linear-gradient(to right, #fff, #00e5ff, #fff);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        .festive-text { font-family: 'Mountains of Christmas', cursive; font-size: 2rem; color: #ffd700; }

        /* --- 🚂 TRAIN SYSTEM --- */
        #sky-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; overflow: hidden; }

        .train-container {
            position: absolute;
            display: flex;
            align-items: center;
            white-space: nowrap;
            pointer-events: auto;
            will-change: transform;
        }

        .train-head {
            font-size: 4rem;
            filter: drop-shadow(0 0 15px gold);
            margin-right: -5px;
            z-index: 2;
        }

        .wish-cart {
            display: inline-flex;
            align-items: center;
            padding: 12px 25px;
            margin-left: 8px;
            border-radius: 12px;
            border: 4px solid #fff;
            box-shadow: 0 6px 12px rgba(0,0,0,0.4);
            position: relative;
        }

        /* ล้อรถไฟ */
        .wish-cart::before, .wish-cart::after {
            content: '⚫';
            position: absolute;
            bottom: -18px;
            font-size: 1.2rem;
            color: #333;
        }
        .wish-cart::before { left: 15%; }
        .wish-cart::after { right: 15%; }

        .wish-cart .text { font-weight: 800; font-size: 1.5rem; text-shadow: 1px 1px 2px rgba(255,255,255,0.5); }

        @keyframes trainRunLTR {
            from { transform: translateX(-100%); }
            to { transform: translateX(100vw); }
        }

        @keyframes trainRunRTL {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }

        /* --- QR & STATUS --- */
        .qr-zone {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.7); backdrop-filter: blur(8px);
            padding: 15px; border-radius: 20px; border: 2px solid #fff;
            text-align: center;
        }
        .qr-img-box { width: 140px; height: 140px; background: #fff; border-radius: 10px; padding: 5px; }
        .qr-img-box img { width: 100%; height: 100%; }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>
    
    <div class="logo-box"><img src="logo.png" alt="Logo"></div>

    <div class="main-header">
        <h1>AI WISHES TRAIN</h1>
        <div class="festive-text">Merry Christmas & Happy New Year 2026</div>
    </div>

    <div id="sky-container"></div>

    <div class="qr-zone">
        <div style="color:#ffea00; font-weight:800; margin-bottom:10px;">🎁 สแกนส่งคำอวยพร</div>
        <div class="qr-img-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://weerapat26458-ctrl.github.io/newyearwish/Sender.html" alt="QR">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2Z7g9l5D9P6iLIe2UseL9UPwwzN05h4Q",
            authDomain: "newyearwish-6006d.firebaseapp.com",
            databaseURL: "https://newyearwish-6006d-default-rtdb.firebaseio.com",
            projectId: "newyearwish-6006d",
            storageBucket: "newyearwish-6006d.firebasestorage.app",
            appId: "1:2243087360:web:8b6d73f67ea1488b12dce5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const wishesRef = ref(db, 'wishes');

        let messagePool = ["Happy New Year!", "สวัสดีปีใหม่ 2569", "ขอให้รวยๆ", "Merry Christmas"];
        let displayQueue = [];
        const colorThemes = [
            { bg: "rgba(255,235,238,0.95)", text: "#b71c1c" },
            { bg: "rgba(232,245,233,0.95)", text: "#1b5e20" },
            { bg: "rgba(255,253,231,0.95)", text: "#f57f17" },
            { bg: "rgba(227,242,253,0.95)", text: "#0d47a1" }
        ];

        onChildAdded(wishesRef, (snap) => {
            const msg = snap.val().message;
            if(msg) {
                displayQueue.push(msg);
                if(!messagePool.includes(msg)) messagePool.push(msg);
            }
        });

        function createTrain() {
            const container = document.getElementById('sky-container');
            const train = document.createElement('div');
            train.classList.add('train-container');
            
            // สุ่มทิศทาง (LTR = ซ้ายไปขวา, RTL = ขวาไปซ้าย)
            const isLTR = Math.random() > 0.5;
            const animName = isLTR ? 'trainRunLTR' : 'trainRunRTL';
            const trainEmoji = isLTR ? '🚂' : '🚂'; // สามารถเปลี่ยนเป็นกวางเรนเดียร์ 🦌 ได้

            // สุ่มความสูง
            train.style.top = (Math.random() * 60 + 20) + '%';
            
            let html = `<div class="train-head" style="${!isLTR ? 'transform: scaleX(-1)' : ''}">${trainEmoji}</div>`;
            
            // จำนวนตู้ (1-3 ตู้)
            const count = Math.min(displayQueue.length || 1, Math.floor(Math.random() * 3) + 1);
            
            for(let i=0; i<count; i++) {
                const text = displayQueue.length > 0 ? displayQueue.shift() : messagePool[Math.floor(Math.random()*messagePool.length)];
                const theme = colorThemes[Math.floor(Math.random()*colorThemes.length)];
                html += `
                    <div class="wish-cart" style="background:${theme.bg}; border-color:${theme.text}; order:${isLTR ? i+1 : -i}">
                        <span class="text" style="color:${theme.text}">${text}</span>
                    </div>
                `;
            }

            train.innerHTML = html;
            const duration = Math.random() * 10 + 15;
            train.style.animation = `${animName} ${duration}s linear forwards`;
            
            container.appendChild(train);
            setTimeout(() => train.remove(), duration * 1000);
        }

        // ปล่อยรถไฟทุก 4 วินาที
        setInterval(createTrain, 4000);

        // --- 🎆 FIREWORKS SYSTEM (SDU + STANDARD) ---
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, sduPoints = [];
        let particles = [], rockets = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            prepSDU();
        }

        function prepSDU() {
            const tCanvas = document.createElement('canvas');
            const tCtx = tCanvas.getContext('2d');
            tCanvas.width = width; tCanvas.height = height;
            tCtx.font = "bold 160px Kanit";
            tCtx.textAlign = "center";
            tCtx.fillText("SDU", width/2, height/3);
            const data = tCtx.getImageData(0,0,width,height).data;
            sduPoints = [];
            for(let y=0; y<height; y+=5) {
                for(let x=0; x<width; x+=5) {
                    if(data[(y*width+x)*4+3] > 128) sduPoints.push({x,y});
                }
            }
        }

        class Rocket {
            constructor(isSDU = false) {
                this.isSDU = isSDU;
                this.x = isSDU ? width/2 : Math.random()*width;
                this.y = height;
                this.ty = isSDU ? height/3 : Math.random()*height/2;
                this.v = -10;
                this.hue = Math.random()*360;
            }
            update() {
                this.y += this.v;
                if(this.y <= this.ty) {
                    this.explode();
                    return false;
                }
                return true;
            }
            explode() {
                if(this.isSDU) {
                    sduPoints.forEach(p => {
                        particles.push(new Particle(this.x, this.y, p.x, p.y, true));
                    });
                } else {
                    for(let i=0; i<80; i++) particles.push(new Particle(this.x, this.y, 0, 0, false, this.hue));
                }
            }
        }

        class Particle {
            constructor(x, y, tx, ty, isSDU, hue=0) {
                this.x = x; this.y = y;
                this.isSDU = isSDU;
                this.alpha = 1;
                if(isSDU) {
                    this.tx = tx; this.ty = ty;
                    this.s = Math.random()*0.05 + 0.02;
                    this.hue = Math.random()*360;
                } else {
                    const ang = Math.random()*Math.PI*2;
                    const vel = Math.random()*4 + 2;
                    this.vx = Math.cos(ang)*vel;
                    this.vy = Math.sin(ang)*vel;
                    this.hue = hue;
                }
            }
            update() {
                if(this.isSDU) {
                    this.x += (this.tx - this.x)*this.s;
                    this.y += (this.ty - this.y)*this.s;
                    this.alpha -= 0.005;
                } else {
                    this.x += this.vx; this.y += this.vy; this.vy += 0.05;
                    this.alpha -= 0.015;
                }
                return this.alpha > 0;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.fillRect(this.x, this.y, 2, 2);
            }
        }

        function render() {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0,0,width,height);
            if(Math.random() < 0.03) rockets.push(new Rocket(Math.random() < 0.1));
            rockets = rockets.filter(r => r.update());
            particles = particles.filter(p => {
                const alive = p.update();
                if(alive) p.draw();
                return alive;
            });
            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize();
        render();
    </script>
</body>
</html>
