<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Event: Wishes Train 2026 (Anti-Messy Version)</title>
    <style>
        /* Import ฟอนต์ */
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;800&family=Mountains+of+Christmas:wght@700&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000 url('bg.png') no-repeat center center / cover;
            font-family: 'Kanit', sans-serif; 
            color: white; 
            height: 100vh; 
            position: relative; 
        }

        /* Canvas พลุอยู่หลังสุด */
        #fireworks-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none;
        }

        /* --- 🦉 LOGO & HEADER --- */
        .logo-box {
            position: fixed; top: 20px; left: 20px; z-index: 200; 
            width: 220px; animation: logoFloat 4s ease-in-out infinite; 
        }
        .logo-box img { width: 100%; height: auto; border-radius: 50%; filter: drop-shadow(0 0 10px #00e5ff); }

        .main-header {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            z-index: 100; text-align: center; width: 100%; pointer-events: none;
        }
        .main-header h1 {
            font-weight: 800; font-size: 4.5rem; margin: 0; line-height: 1.1;
            background: linear-gradient(to right, #ffffff, #00e5ff, #ffffff);
            background-size: 200% auto; -webkit-background-clip: text; -webkit-text-fill-color: transparent;
            animation: shine 3s linear infinite;
        }
        .festive-text { font-family: 'Mountains of Christmas', cursive; font-size: 2rem; color: #ffd700; margin-top: 5px; }

        /* --- 🚂 TRAIN SYSTEM (THE CORE) --- */
        #sky-container { position: absolute; width: 100%; height: 100%; top: 0; left: 0; z-index: 10; overflow: hidden; }

        .train-container {
            position: absolute;
            display: flex;
            align-items: center;
            white-space: nowrap;
            pointer-events: auto;
            will-change: transform;
        }

        .train-head {
            font-size: 4rem;
            filter: drop-shadow(0 0 15px gold);
            z-index: 2;
        }

        .wish-cart {
            display: inline-flex;
            align-items: center;
            padding: 12px 25px;
            margin: 0 5px;
            border-radius: 12px;
            border: 4px solid #fff;
            box-shadow: 0 6px 12px rgba(0,0,0,0.5);
            position: relative;
            max-width: 350px; /* จำกัดความกว้างไม่ให้ตู้ยาวเกินไป */
        }

        /* ล้อรถไฟ */
        .wish-cart::before, .wish-cart::after {
            content: '⚫';
            position: absolute;
            bottom: -18px;
            font-size: 1.2rem;
            color: #222;
        }
        .wish-cart::before { left: 15%; }
        .wish-cart::after { right: 15%; }

        .wish-cart .text { font-weight: 800; font-size: 1.4rem; white-space: normal; word-break: break-word; }

        /* Animation แยกทิศทาง */
        @keyframes trainRunLTR {
            from { transform: translateX(-100%); }
            to { transform: translateX(100vw); }
        }
        @keyframes trainRunRTL {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }

        /* --- 🎁 QR ZONE --- */
        .qr-zone {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 20px; border: 2px solid rgba(255,255,255,0.5);
            text-align: center;
        }
        .qr-img-box { width: 140px; height: 140px; background: white; border-radius: 10px; padding: 5px; }
        .qr-img-box img { width: 100%; height: 100%; }

        @keyframes shine { to { background-position: 200% center; } }
        @keyframes logoFloat { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>
    
    <div class="logo-box"><img src="logo.png" alt="Logo"></div>

    <div class="main-header">
        <h1>AI WISHES TRAIN</h1>
        <div class="festive-text">Merry Christmas & Happy New Year 2026</div>
    </div>

    <div id="sky-container"></div>

    <div class="qr-zone">
        <div style="color:#ffea00; font-weight:800; margin-bottom:10px; font-size: 1.1rem;">🎁 สแกนเพื่อส่งคำอวยพร</div>
        <div class="qr-img-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://weerapat26458-ctrl.github.io/newyearwish/Sender.html" alt="QR">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2Z7g9l5D9P6iLIe2UseL9UPwwzN05h4Q",
            authDomain: "newyearwish-6006d.firebaseapp.com",
            databaseURL: "https://newyearwish-6006d-default-rtdb.firebaseio.com",
            projectId: "newyearwish-6006d",
            storageBucket: "newyearwish-6006d.firebasestorage.app",
            appId: "1:2243087360:web:8b6d73f67ea1488b12dce5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const wishesRef = ref(db, 'wishes');

        let messagePool = ["Happy New Year!", "สวัสดีปีใหม่ 2569", "ขอให้รวยๆ", "Merry Christmas"];
        let displayQueue = [];
        
        const lanes = [20, 35, 50, 65, 80]; // ตำแหน่งความสูงเลน (%)
        let laneLastUsed = [0, 0, 0, 0, 0]; // เวลาล่าสุดที่แต่ละเลนถูกใช้

        const colorThemes = [
            { bg: "rgba(255, 235, 238, 0.95)", text: "#b71c1c" },
            { bg: "rgba(232, 245, 233, 0.95)", text: "#1b5e20" },
            { bg: "rgba(255, 253, 231, 0.95)", text: "#f57f17" },
            { bg: "rgba(227, 242, 253, 0.95)", text: "#0d47a1" },
            { bg: "rgba(243, 229, 245, 0.95)", text: "#4a148c" }
        ];

        onChildAdded(wishesRef, (snap) => {
            const msg = snap.val().message;
            if(msg) {
                displayQueue.push(msg);
                if(!messagePool.includes(msg)) messagePool.push(msg);
            }
        });

        function createTrain() {
            const now = Date.now();
            // เลือกเลนที่ว่าง (ไม่ได้ใช้มาอย่างน้อย 5 วินาที)
            const availableLanes = lanes.map((_, i) => i).filter(i => now - laneLastUsed[i] > 5000);
            if (availableLanes.length === 0) return;

            const laneIdx = availableLanes[Math.floor(Math.random() * availableLanes.length)];
            const topPos = lanes[laneIdx];
            laneLastUsed[laneIdx] = now;

            const container = document.getElementById('sky-container');
            const train = document.createElement('div');
            train.classList.add('train-container');
            
            const isLTR = Math.random() > 0.5;
            const animName = isLTR ? 'trainRunLTR' : 'trainRunRTL';
            
            train.style.top = topPos + '%';
            train.style.zIndex = Math.floor(topPos);

            // สร้างหัวรถไฟ
            const headHTML = `<div class="train-head" style="transform: ${isLTR ? 'none' : 'scaleX(-1)'}">🚂</div>`;
            
            // สร้างตู้รถไฟ (1-3 ตู้)
            let cartsHTML = '';
            const count = Math.min(displayQueue.length || 1, Math.floor(Math.random() * 3) + 1);
            
            for(let i=0; i<count; i++) {
                const text = displayQueue.length > 0 ? displayQueue.shift() : messagePool[Math.floor(Math.random()*messagePool.length)];
                const theme = colorThemes[Math.floor(Math.random()*colorThemes.length)];
                cartsHTML += `
                    <div class="wish-cart" style="background:${theme.bg}; border-color:${theme.text};">
                        <span class="text" style="color:${theme.text}">${text}</span>
                    </div>
                `;
            }

            // ประกอบขบวนตามทิศทาง
            train.innerHTML = isLTR ? headHTML + cartsHTML : cartsHTML + headHTML;

            const duration = 18 + Math.random() * 7; // ความเร็วรถไฟ
            train.style.animation = `${animName} ${duration}s linear forwards`;
            
            container.appendChild(train);
            setTimeout(() => train.remove(), duration * 1000);
        }

        // ปล่อยขบวนใหม่ทุกๆ 3 วินาที (ถ้ามีเลนว่าง)
        setInterval(createTrain, 3000);

        // --- 🎆 พลุ SDU & พลุมาตรฐาน ---
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, sduPoints = [], particles = [], rockets = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
            prepSDU();
        }

        function prepSDU() {
            const tCanvas = document.createElement('canvas');
            const tCtx = tCanvas.getContext('2d');
            tCanvas.width = width; tCanvas.height = height;
            tCtx.font = "bold 160px Kanit";
            tCtx.textAlign = "center";
            tCtx.fillText("SDU", width/2, height/3);
            const data = tCtx.getImageData(0,0,width,height).data;
            sduPoints = [];
            for(let y=0; y<height; y+=5) {
                for(let x=0; x<width; x+=5) {
                    if(data[(y*width+x)*4+3] > 128) sduPoints.push({x,y});
                }
            }
        }

        class Rocket {
            constructor(isSDU = false) {
                this.isSDU = isSDU;
                this.x = isSDU ? width/2 : Math.random()*width;
                this.y = height;
                this.ty = isSDU ? height/3 : Math.random()*height/2.5;
                this.v = -10;
                this.hue = Math.random()*360;
            }
            update() {
                this.y += this.v;
                if(this.y <= this.ty) { this.explode(); return false; }
                return true;
            }
            explode() {
                if(this.isSDU) {
                    sduPoints.forEach(p => particles.push(new Particle(this.x, this.y, p.x, p.y, true)));
                } else {
                    for(let i=0; i<60; i++) particles.push(new Particle(this.x, this.y, 0, 0, false, this.hue));
                }
            }
        }

        class Particle {
            constructor(x, y, tx, ty, isSDU, hue=0) {
                this.x = x; this.y = y; this.isSDU = isSDU; this.alpha = 1;
                if(isSDU) {
                    this.tx = tx; this.ty = ty; this.s = Math.random()*0.04 + 0.02; this.hue = Math.random()*360;
                } else {
                    const ang = Math.random()*Math.PI*2; const vel = Math.random()*4 + 2;
                    this.vx = Math.cos(ang)*vel; this.vy = Math.sin(ang)*vel; this.hue = hue;
                }
            }
            update() {
                if(this.isSDU) {
                    this.x += (this.tx - this.x)*this.s; this.y += (this.ty - this.y)*this.s; this.alpha -= 0.007;
                } else {
                    this.x += this.vx; this.y += this.vy; this.vy += 0.05; this.alpha -= 0.015;
                }
                return this.alpha > 0;
            }
            draw() {
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                ctx.fillRect(this.x, this.y, 2, 2);
            }
        }

        function render() {
            ctx.fillStyle = 'rgba(0,0,0,0.2)';
            ctx.fillRect(0,0,width,height);
            if(Math.random() < 0.03) rockets.push(new Rocket(Math.random() < 0.1));
            rockets = rockets.filter(r => r.update());
            particles = particles.filter(p => { const alive = p.update(); if(alive) p.draw(); return alive; });
            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize(); render();
    </script>
</body>
</html>
