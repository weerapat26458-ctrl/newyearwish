<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Event: The One & Only Wish Train 2026</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Kanit:wght@400;800&family=Mountains+of+Christmas:wght@700&display=swap');

        body { 
            margin: 0; 
            overflow: hidden; 
            background: #000 url('bg.png') no-repeat center center / cover;
            font-family: 'Kanit', sans-serif; 
            color: white; 
            height: 100vh; 
            position: relative; 
        }

        #fireworks-canvas {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            z-index: 5; pointer-events: none;
        }

        .main-header {
            position: fixed; top: 25px; left: 50%; transform: translateX(-50%);
            z-index: 100; text-align: center; width: 100%; pointer-events: none;
        }

        /* --- 🚂 INFINITE TRAIN CONTAINER --- */
        #sky-container { 
            position: absolute; width: 100%; height: 100%; 
            top: 0; left: 0; z-index: 10; overflow: hidden; 
        }

        #infinite-train {
            position: absolute;
            display: flex;
            align-items: center;
            white-space: nowrap;
            top: 55%; /* ตำแหน่งความสูงของขบวนรถไฟ */
            left: 0;
            will-change: transform;
            /* เริ่มต้นวิ่งจากนอกจอด้านขวา */
            transform: translateX(100vw);
        }

        .train-head { 
            font-size: 5rem; 
            filter: drop-shadow(0 0 15px gold) drop-shadow(0 0 5px white);
            flex-shrink: 0; 
            margin-right: 5px;
            transform: scaleX(-1); /* กลับด้านหัวรถไฟให้หันไปทางซ้าย */
        }

        .wish-cart {
            display: inline-flex;
            align-items: center;
            padding: 15px 35px;
            margin: 0 10px;
            border-radius: 15px;
            border: 5px solid #fff;
            box-shadow: 0 8px 15px rgba(0,0,0,0.6);
            position: relative;
            flex-shrink: 0;
            animation: cartPop 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes cartPop { from { transform: scale(0); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        /* ล้อรถไฟใต้ตู้ */
        .wish-cart::before, .wish-cart::after {
            content: '⚫'; position: absolute; bottom: -25px; font-size: 1.5rem; color: #111;
            filter: drop-shadow(0 0 2px rgba(255,255,255,0.3));
        }
        .wish-cart::before { left: 20%; }
        .wish-cart::after { right: 20%; }

        .wish-cart .text { font-weight: 800; font-size: 1.8rem; text-shadow: 1px 1px 0px rgba(255,255,255,0.4); }

        /* --- 🎁 QR ZONE --- */
        .qr-zone {
            position: fixed; bottom: 20px; right: 20px; z-index: 100;
            background: rgba(0, 0, 0, 0.8); backdrop-filter: blur(10px);
            padding: 15px; border-radius: 20px; border: 3px solid #fff;
            text-align: center; box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .qr-img-box { width: 140px; height: 140px; background: white; border-radius: 10px; padding: 5px; }
        .qr-img-box img { width: 100%; height: 100%; }

        /* Animation เคลื่อนที่ (จะถูก JS ปรับค่า translateX ตลอดเวลา) */
        @keyframes trainMove {
            from { transform: translateX(100vw); }
            to { transform: translateX(-100%); }
        }
    </style>
</head>
<body>

    <canvas id="fireworks-canvas"></canvas>
    
    <div class="main-header">
        <h1 style="font-size: 4.5rem; margin: 0; color: #00e5ff; text-shadow: 0 0 20px #00e5ff, 0 0 40px #00e5ff;">THE INFINITE WISH TRAIN</h1>
        <div style="font-family: 'Mountains of Christmas'; font-size: 2.5rem; color: #ffd700;">Merry Christmas & Happy New Year 2026</div>
    </div>

    <div id="sky-container">
        <div id="infinite-train">
            <div class="train-head">🚂</div>
            </div>
    </div>

    <div class="qr-zone">
        <div style="color:#ffea00; font-weight:800; margin-bottom:10px; font-size: 1.2rem;">🎁 สแกนเพื่อต่อขบวนรถไฟ</div>
        <div class="qr-img-box">
            <img src="https://api.qrserver.com/v1/create-qr-code/?size=150x150&data=https://weerapat26458-ctrl.github.io/newyearwish/Sender.html" alt="QR">
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-app.js";
        import { getDatabase, ref, onChildAdded } from "https://www.gstatic.com/firebasejs/11.0.2/firebase-database.js";

        // --- Firebase Configuration ---
        const firebaseConfig = {
            apiKey: "AIzaSyB2Z7g9l5D9P6iLIe2UseL9UPwwzN05h4Q",
            authDomain: "newyearwish-6006d.firebaseapp.com",
            databaseURL: "https://newyearwish-6006d-default-rtdb.firebaseio.com",
            projectId: "newyearwish-6006d",
            appId: "1:2243087360:web:8b6d73f67ea1488b12dce5"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const wishesRef = ref(db, 'wishes');

        const trainContainer = document.getElementById('infinite-train');
        const colorThemes = [
            { bg: "#ffebee", text: "#b71c1c" },
            { bg: "#e8f5e9", text: "#1b5e20" },
            { bg: "#fffde7", text: "#f57f17" },
            { bg: "#e3f2fd", text: "#0d47a1" },
            { bg: "#f3e5f5", text: "#4a148c" },
            { bg: "#fff3e0", text: "#e65100" }
        ];

        // ฟังก์ชันเพิ่มตู้รถไฟใหม่
        function addCart(message) {
            const theme = colorThemes[Math.floor(Math.random() * colorThemes.length)];
            const cart = document.createElement('div');
            cart.className = 'wish-cart';
            cart.style.backgroundColor = theme.bg;
            cart.style.borderColor = theme.text;
            cart.style.color = theme.text;
            cart.innerHTML = `<span class="text">${message}</span>`;
            
            trainContainer.appendChild(cart);
            
            // อัปเดต Animation ทุกครั้งที่มีการเพิ่มตู้เพื่อให้ความเร็วสัมพันธ์กับความยาว
            updateTrainAnimation();
        }

        function updateTrainAnimation() {
            const trainWidth = trainContainer.scrollWidth;
            const screenWidth = window.innerWidth;
            
            // คำนวณเวลาวิ่ง: ยิ่งยาว ยิ่งใช้เวลามากเพื่อให้ความเร็ว (Pixel per Second) ดูคงที่
            // สูตร: (ความยาวรถไฟ + ความกว้างหน้าจอ) / ความเร็วที่ต้องการ
            const duration = (trainWidth + screenWidth) / 120; // 120 คือความเร็วพิกเซลต่อวินาที

            // ลบขบวนที่วิ่งอยู่แล้วใส่แอนิเมชันใหม่ (รักษาตำแหน่งเดิม)
            trainContainer.style.animation = 'none';
            void trainContainer.offsetWidth; // Trigger reflow
            trainContainer.style.animation = `trainMove ${duration}s linear infinite`;
        }

        // ฟังข้อมูลใหม่จาก Firebase
        onChildAdded(wishesRef, (snap) => {
            const msg = snap.val().message;
            if(msg) {
                addCart(msg);
            }
        });

        // --- ระบบพลุพื้นหลัง ---
        const canvas = document.getElementById('fireworks-canvas');
        const ctx = canvas.getContext('2d');
        let width, height, particles = [];

        function resize() {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        }

        function createFirework() {
            const x = Math.random() * width;
            const y = Math.random() * (height / 2);
            const hue = Math.random() * 360;
            for(let i=0; i<40; i++) {
                const angle = Math.random() * Math.PI * 2;
                const speed = Math.random() * 3 + 1;
                particles.push({
                    x, y, 
                    vx: Math.cos(angle) * speed, 
                    vy: Math.sin(angle) * speed, 
                    alpha: 1, 
                    hue: hue
                });
            }
        }

        function render() {
            ctx.fillStyle = 'rgba(0,0,0,0.15)';
            ctx.fillRect(0,0,width,height);
            
            if(Math.random() < 0.04) createFirework();

            particles = particles.filter(p => {
                p.x += p.vx; p.y += p.vy; p.vy += 0.04; p.alpha -= 0.012;
                ctx.globalAlpha = p.alpha;
                ctx.fillStyle = `hsl(${p.hue}, 100%, 70%)`;
                ctx.fillRect(p.x, p.y, 2, 2);
                return p.alpha > 0;
            });
            requestAnimationFrame(render);
        }

        window.addEventListener('resize', resize);
        resize();
        render();

    </script>
</body>
</html>
